<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saskia van den Baar</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/baguettebox.js/1.11.1/baguetteBox.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html {
            scroll-behavior: smooth; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111111; 
            color: #f5f5f5;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(17, 17, 17, 0.9);
            backdrop-filter: blur(10px); 
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
        }

        .brand span {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        section {
            padding: 120px 20px 60px 20px; 
            max-width: 1200px;
            margin: 0 auto;
            min-height: 80vh;
        }

        section h2 {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 30px;
            color: #fff;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .gallery-link {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 4px;
            background-color: #1a1a1a;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .gallery-link:hover {
            transform: scale(1.02);
        }

        .gallery-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
            display: block;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #555;
            font-size: 0.9rem;
            border-top: 1px solid #222;
        }

        @media (max-width: 600px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            section {
                padding-top: 160px;
            }
            .portfolio-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="brand">
                <span>Saskia van den Baar</span>
            </a>
        </div>
    </header>

    <!-- Sectie hernoemd naar haakwerk -->
    <section id="haakwerk">
        <h2>Mijn haakwerk</h2>
        <div class="portfolio-grid" id="grid-haakwerk">
            <!-- Wordt razendsnel gevuld door JS -->
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Saskia van den Baar</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/baguettebox.js/1.11.1/baguetteBox.min.js"></script>

    <script>
        const username = "robertvandenbaar";
        const repo = "saskia.vandenbaar";
        const fotoFolder = "images_cached";
        const imageExtensions = ['jpg', 'jpeg', 'png', 'webp', 'gif'];

        async function fetchAndBuildGallery(folderPath, targetGridId, relativeHrefPrefix) {
            const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${folderPath}`;
            const gridContainer = document.getElementById(targetGridId);
            
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`Kan map ${folderPath} niet laden.`);
                
                const files = await response.json();
                files.reverse();

                // Sla de HTML tijdelijk op in het geheugen in plaats van direct te renderen
                let galleryHtml = '';

                files.forEach(file => {
                    const fileExtension = file.name.split('.').pop().toLowerCase();
                    
                    if (file.type === 'file' && imageExtensions.includes(fileExtension)) {
                        const fileUrl = `${relativeHrefPrefix}${file.name}`;
                        
                        // We plakken de code achter elkaar in de variabele
                        galleryHtml += `
                            <a class="gallery-link" href="${fileUrl}">
                                <img class="gallery-image" src="${fileUrl}" alt="Gehaakt handwerk" loading="lazy" width="300" height="300" />
                            </a>
                        `;
                    }
                });

                // Pas aan het einde van de rit dwingen we de browser 1x te renderen
                gridContainer.innerHTML = galleryHtml;

                // Activeer direct daarna baguetteBox
                baguetteBox.run(`#${targetGridId}`, { animation: 'slideIn', noScrollbars: true });

            } catch (error) {
                console.error(error);
                gridContainer.innerHTML = '<p style="color: #666;">Afbeeldingen konden niet worden geladen.</p>';
            }
        }

        async function initPage() {
            // Let op: target aangepast naar 'grid-haakwerk'
            await fetchAndBuildGallery(fotoFolder, 'grid-haakwerk', './images_cached/');
        }

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
    
</body>
</html>
